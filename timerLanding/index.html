<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KindRoot | Organic Skincare Collection</title>
    <link rel="stylesheet" href="./styles.css">
    <!-- <script src="./script.js"></script> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
</head>

<body>

    <div class="loader">
        <div class="overlay">
            <div class="block"></div>
            <div class="block"></div>
        </div>

        <div class="intro-logo">
            <div class="word" id="word-1">
                <h1><span>Kind</span></h1>
            </div>
            <div class="word" id="word-2">
                <h1>Root</h1>
            </div>
        </div>

        <div class="divider"></div>

        <div class="spinner-container">
            <div class="spinner"></div>
        </div>

        <div class="counter">
            <div class="count">
                <div class="digit">
                    <h1>0</h1>
                </div>
                <div class="digit">
                    <h1>0</h1>
                </div>
            </div>
            <div class="count">
                <div class="digit">
                    <h1>2</h1>
                </div>
                <div class="digit">
                    <h1>7</h1>
                </div>
            </div>
            <div class="count">
                <div class="digit">
                    <h1>6</h1>
                </div>
                <div class="digit">
                    <h1>5</h1>
                </div>
            </div>
            <div class="count">
                <div class="digit">
                    <h1>9</h1>
                </div>
                <div class="digit">
                    <h1>8</h1>
                </div>
            </div>
            <div class="count">
                <div class="digit">
                    <h1>9</h1>
                </div>
                <div class="digit">
                    <h1>9</h1>
                </div>
            </div>
        </div>
    </div>


    <!-- Main Content of the Website -->

    <div class="container">
        <div class="hero-img">
            <img src="hero.jpg" alt="KindRoot natural skincare products with botanical ingredients">
        </div>

        <div class="nav">
            <div class="logo">
                <a href="#">KindRoot</a>
            </div>

            <div class="nav-links">
                <a href="#" class="hover-link">Collections</a>
                <a href="#" class="hover-link">Ingredients</a>
                <a href="#" class="hover-link">Philosophy</a>
                <a href="#" class="hover-link">Journal</a>
            </div>
            <div class="btn">
                <a href="#" class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                </a>
            </div>
        </div>


        <div class="header">
            <div class="hero-copy">
                <div class="line">
                    <h1><span>Rooted</span> in nature.</h1>
                </div>
                <div class="line">
                    <h1>crafted with <span>Kindness</span></h1>
                </div>
            </div>
            <div class="line">
                <p>Luxurious organic skincare that nurtures your skin and respects our planet</p>
            </div>
        </div>

        <div class="featured">
            <div class="featured-item" data-speed="0.8">
                <span>Organic</span>
            </div>
            <div class="featured-item" data-speed="1.2">
                <span>Sustainable</span>
            </div>
            <div class="featured-item" data-speed="0.9">
                <span>Cruelty-Free</span>
            </div>
        </div>

        <div class="cta">
            <div class="cta-label">
                <p>Explore our collection</p>
            </div>
            <div class="cta-icon">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </div>

        <div class="scroll-indicator">
            <div class="scroll-text">Scroll to discover</div>
            <div class="scroll-line"></div>
        </div>

    </div>




    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/Flip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/CustomEase.min.js"></script>

    <script type="module" src="./script.js"></script>
</body>

</html>
